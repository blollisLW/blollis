<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact Brandon Lollis for help and support."
    >

    <title>Brandon Lollis | Contact</title>

    <style>
        :root {
            --primary: #0067B8;
            --primary-light: #3C9DE0;
            --secondary: #0F172A;

            --accent: #6B4FB3;
            --accent-dark: #5A3FA0;

            --background: #F7F9FC;
            --surface: #FFFFFF;
            --border: #E6EAF0;

            --muted-text: #64748B;
            --success: #2E7D32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: light;
        }

        body {
            min-height: 100vh;
            padding: 32px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--secondary);

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(0, 103, 184, 0.18),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(107, 79, 179, 0.16),
                    transparent 35%
                ),
                var(--background);
        }

        .profile-card {
            position: relative;

            width: 100%;
            max-width: 500px;

            overflow: hidden;
            text-align: center;

            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(230, 234, 240, 0.95);
            border-radius: 28px;

            box-shadow:
                0 28px 70px rgba(15, 23, 42, 0.13),
                0 8px 24px rgba(0, 103, 184, 0.08);
        }

        .accent-bar {
            height: 10px;

            background: linear-gradient(
                90deg,
                var(--primary),
                var(--primary-light),
                var(--accent)
            );
        }

        .card-content {
            padding: 50px 42px 46px;
        }

        .portrait-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 28px;
        }

        .portrait-wrap::before {
            content: "";
            position: absolute;
            inset: -10px;

            z-index: 0;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-light),
                var(--accent)
            );

            box-shadow:
                0 14px 32px rgba(0, 103, 184, 0.22),
                0 8px 24px rgba(107, 79, 179, 0.15);
        }

        .headshot {
            position: relative;
            z-index: 1;

            display: block;

            width: 250px;
            height: 250px;

            object-fit: cover;
            object-position: center 28%;

            border: 7px solid var(--surface);
            border-radius: 50%;

            background: var(--surface);
        }

        h1 {
            margin-bottom: 9px;

            font-size: clamp(2rem, 7vw, 2.65rem);
            line-height: 1.1;
            letter-spacing: -0.035em;

            color: var(--secondary);
        }

        .tagline {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 30px;

            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
        }

        .tagline::before {
            content: "";

            width: 8px;
            height: 8px;

            border-radius: 50%;
            background: var(--success);

            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }

        .message {
            margin-bottom: 26px;

            font-size: 1.2rem;
            line-height: 1.6;
            color: #334155;
        }

        .message strong {
            color: var(--secondary);
        }

        .email-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            min-width: 190px;
            padding: 15px 28px;

            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;

            border: 0;
            border-radius: 999px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );

            box-shadow:
                0 12px 24px rgba(0, 103, 184, 0.2),
                0 8px 18px rgba(107, 79, 179, 0.12);

            transition:
                transform 180ms ease,
                box-shadow 180ms ease,
                filter 180ms ease;
        }

        .email-button svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;

            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .email-button:hover {
            transform: translateY(-3px);
            filter: brightness(1.06);

            box-shadow:
                0 17px 32px rgba(0, 103, 184, 0.25),
                0 10px 22px rgba(107, 79, 179, 0.18);
        }

        .email-button:active {
            transform: translateY(-1px);
        }

        .email-button:focus-visible {
            outline: 4px solid rgba(0, 103, 184, 0.22);
            outline-offset: 4px;
        }

        .email-address {
            display: block;
            margin-top: 16px;

            color: var(--muted-text);
            font-size: 0.88rem;
            text-decoration: none;

            transition: color 180ms ease;
        }

        .email-address:hover {
            color: var(--primary);
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 14px;
            }

            .profile-card {
                border-radius: 22px;
            }

            .card-content {
                padding: 40px 24px 38px;
            }

            .headshot {
                width: 210px;
                height: 210px;
            }

            .message {
                font-size: 1.08rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .email-button,
            .email-address {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="profile-card">

        <div class="accent-bar"></div>

        <div class="card-content">

            <div class="portrait-wrap">
                <img
                    class="headshot"
                    src="Headshot.png"
                    alt="Illustrated portrait of Brandon Lollis"
                >
            </div>

            <h1>Brandon Lollis</h1>

            <div class="tagline">
                Always happy to help
            </div>

            <p class="message">
                <strong>Need help?</strong><br>
                Please reach out.
            </p>

            <a
                class="email-button"
                href="mailto:yourname@example.com"
                aria-label="Send Brandon Lollis an email"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                </svg>

                Email Me
            </a>

            <a
                class="email-address"
                href="mailto:yourname@example.com"
            >
                yourname@example.com
            </a>

        </div>

    </main>

</body>
</html>
